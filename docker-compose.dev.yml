version: "3.8"

# Development overrides - use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  searxng:
    ports:
      - "8081:8080"

  cloudflared:
    profiles:
      - tunnel
